name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    name: JaCoCo + Coveralls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # jacoco-maven-plugin's prepare-agent execution attaches the coverage
      # agent before surefire forks, and its `report` execution (bound to the
      # `test` phase in pom.xml) writes target/site/jacoco/jacoco.xml. GPG
      # signing stays off — this job publishes nothing.
      - name: mvn verify (runs tests under the JaCoCo agent)
        run: mvn -B verify

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329  # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          format: jacoco
          file: target/site/jacoco/jacoco.xml
