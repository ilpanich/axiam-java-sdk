# .github/dependabot.yml
#
# Automated dependency updates for the standalone AXIAM Java SDK repo.
# Two maven entries because bom/pom.xml is an independent reactor, not a module
# of the root (jar-packaged) SDK POM — Dependabot resolves each POM separately.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # The Maven Wrapper pin. Maven 3.10 (Resolver 2.x) stages a
      # `maven-metadata-local.xml` that central-publishing-maven-plugin 0.11.0
      # leaves in the bundle, and Central rejects the deployment (RELEASING.md).
      # 3.9.x patches still come through; raise this only once
      # scripts/central-bundle-gate.sh passes on the newer Maven.
      - dependency-name: "org.apache.maven:apache-maven"
        versions: [">= 3.10.0"]
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /bom
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /examples/spring-boot-app
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
